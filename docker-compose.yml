services:
  db:
    image: postgres:16
    container_name: legado-origen-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legado_origen
    ports:
      - '5433:5432'
    volumes:
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/02-create-test-database.sql:/docker-entrypoint-initdb.d/02-create-test-database.sql:ro
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: