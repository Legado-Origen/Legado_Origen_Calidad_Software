name: CI Pipeline - Calidad de Software 
on: 
  push: 
    branches: [ dev, main ] 
  pull_request: 
    branches: [ dev, main ]
    
jobs: 
  lint-and-security: 
    name: Análisis Estático y Auditoría 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout del código 
        uses: actions/checkout@v4
        
      - name: Configurar Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: 20
          cache: 'npm' 
        
      - name: Instalar dependencias 
        run: npm ci 
        
      - name: Ejecutar ESLint 
        run: npm run lint 
          
      - name: Auditoría de seguridad de dependencias 
        run: npm audit --audit-level=high
        continue-on-error: true
          
  test-and-coverage: 
    name: Pruebas Automatizadas y Cobertura 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout del código 
        uses: actions/checkout@v4 
      
      - name: Configurar Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: 20 
          cache: 'npm' 
      
      - name: Instalar dependencias 
        run: npm ci 
        
      - name: Ejecutar pruebas con reporte de cobertura 
        run: npm run test:coverage
